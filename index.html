<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* layout: title → full-width island map with day chips → two-column day timetable */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#16212B; --muted:#5E6E7A; --line:#D5DEE4;
  --sea:#D6E3EA; --land:#FBFCFC; --coast:#9FB3C0; --ice:#E6F0F6; --iceline:#B7CCDA;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#152029; --ink:#E6EDF2; --muted:#93A3AF; --line:#25333E;
  --sea:#0B1B26; --land:#22303B; --coast:#3E5262; --ice:#2E4250; --iceline:#4A6274; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#152029; --ink:#E6EDF2; --muted:#93A3AF; --line:#25333E;
  --sea:#0B1B26; --land:#22303B; --coast:#3E5262; --ice:#2E4250; --iceline:#4A6274; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px/1 var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.chip[aria-pressed="true"] i{background:#fff}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.pin.mid{width:20px;height:20px;font:700 11px/16px var(--mono);color:#fff;text-align:center}
.chip.all{--c:var(--ink)}.chip.all[aria-pressed="true"]{color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.grid .day{cursor:pointer}.grid .day:hover{box-shadow:0 0 0 1px var(--c)}
.grid .day:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pin{position:absolute;transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--land);box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:opacity .2s}
.pin.big{width:24px;height:24px;font:700 12px/20px var(--mono);color:#fff;text-align:center;z-index:2}
.lbl{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);white-space:nowrap;
  font:500 12.5px/1.3 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  padding:3px 7px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lbl.left{left:auto;right:calc(100% + 6px)}

.day{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:16px 18px;min-width:0;
  display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:6px;margin-left:8px}
.nav button{font:500 15px/1 var(--font);width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
li.drive{grid-template-columns:56px 1fr;padding:4px 0;border-top:0}
li.drive .x{font-size:12.5px;color:var(--muted);gap:6px}
li.drive .x::before{content:"";width:2px;height:16px;background:var(--c);border-radius:1px;align-self:center}
li.drive + li{border-top:0}
.dh{display:flex;align-items:center;gap:10px}
.dn{background:var(--c);color:#fff;font:700 13px/1 var(--mono);padding:6px 8px;border-radius:6px}
.dt{font-weight:700;font-size:16px}
.dd{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
li:first-child{border-top:0}
.t{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.t.has{color:var(--ink)}
.x{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.x a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.x a:hover{border-bottom-color:var(--ink)}
.tag{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.note{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.map{position:relative;width:100%;aspect-ratio:964/700;min-height:420px;max-width:100%;border-radius:12px;overflow:hidden;background:var(--sea);border:1px solid var(--line);z-index:0}
.leaflet-container{font-family:var(--font);background:var(--sea)}
.pinwrap{background:none;border:0}
.pin{border-color:#fff}
.leaflet-popup-content{font:14px/1.5 var(--font)}
.leaflet-popup-content a{color:#1C7ED6}
.leaflet-tooltip{font-family:var(--font)}
path.leaflet-interactive:focus{outline:none}
.pp-wrap .leaflet-popup-content-wrapper{padding:0;overflow:hidden;border-radius:12px}
.pp-wrap .leaflet-popup-content{margin:0;width:270px!important}
.pp-wrap a.leaflet-popup-close-button{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:22px;width:28px;height:28px;top:4px;right:4px}
.pp-img{display:block;height:160px;background:#DDE5EA}
.pp-img img{width:100%;height:100%;object-fit:cover;display:block}
.pp-img.none{display:flex;align-items:center;justify-content:center;color:#5E6E7A;font-size:12.5px;height:60px}
.pp-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pp-h{display:flex;align-items:center;gap:8px;font-size:15px}
.pp-n{background:var(--c);color:#fff;font:700 11px/20px var(--mono);width:20px;height:20px;border-radius:50%;text-align:center;flex:none}
.pp-g{font-size:12.5px}
.pp-l{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#5E6E7A;margin-top:4px}
.pp-st{font-weight:500;color:#2F9E44}
.pp textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:64px;font:13.5px/1.45 var(--font);padding:7px 8px;border:1px solid #C9D4DB;border-radius:8px;background:#F7FAFB;color:#16212B}
.pp textarea:focus{outline:2px solid #1C7ED6;outline-offset:-1px;background:#fff}
.pin.has-memo::after{content:"📝";position:absolute;right:-9px;top:-11px;font-size:12px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.pin.mid.has-memo::after{font-size:10px;right:-8px;top:-9px}
.poi-btns a{font-size:16px;line-height:30px!important;text-decoration:none;cursor:pointer}
.poi-btns a.on{background:var(--pc);color:#fff}
.poi-btns a.on:hover{filter:brightness(.92)}
.poi{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--pc);
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.poi.sm{width:20px;height:20px;font-size:11px}
.mp{display:flex;flex-direction:column;gap:5px;font:13px/1.45 var(--font);min-width:220px}
.mp-h{display:flex;align-items:center;gap:6px}
.mp-h b{font-size:15px}
.mt{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;flex:none;background:#2F9E44;color:#fff}
.mp-sub{color:#5E6E7A;font-size:12px}
.mp-c{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mp-c code{font:500 12.5px var(--mono)}
.mp button{font:500 11.5px/1 var(--font);border:1px solid #C9D4DB;background:#fff;color:#16212B;border-radius:6px;padding:4px 8px;cursor:pointer}
.mp button:hover{background:#EDF1F3}
.mp .est{color:#868E96;font-size:11px}
li.memo{padding:2px 0 8px;border-top:0;cursor:pointer}
li.memo + li{border-top:1px solid var(--line)}
li.memo .mm{font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-left:3px solid var(--c);border-radius:4px;padding:5px 9px;white-space:normal;overflow-wrap:anywhere}
.legtip{display:flex;flex-direction:column;gap:2px;font-size:12.5px;line-height:1.4}
.legtip .lt-h{font:700 12px/1 var(--mono);color:var(--c)}
.legtip b{font-size:14px}
</style>

function poiPopup(color,badge,title,lines,lat,lon){

  L.DomEvent.disableClickPropagation(el);return el}
const addrLine=(a,est)=>'📍 '+(a?esc(a)+(est?' <span class="est">(근처 주소로 추정)</span>':''):'<span class="mp-sub">주소 정보 없음</span>');
const WHEEL={yes:'가능',limited:'일부 가능',designated:'가능 (전용)',no:'불가'};
const POI={
  mart:{icon:'🛒',label:'마트',color:'#2F9E44',data:MARTS,minorZoom:10,minor:r=>r[2]==='c',
    popup:([lat,lon,kind,name,brand,addr,hours,est])=>poiPopup(kind==='c'?'#868E96':'#2F9E44',MT[kind],name||'(이름 없음)',
      [brand&&`<span class="mp-sub">${esc(brand)}</span>`,addrLine(addr,est),hours&&'🕒 '+esc(hoursKo(hours))],lat,lon)},
  fuel:{icon:'⛽',label:'주유소',color:'#E8590C',data:FUEL,
    popup:([lat,lon,name,brand,addr,hours,fuels,auto,est])=>poiPopup('#E8590C','주유소',name,
      [brand&&`<span class="mp-sub">${esc(brand)}</span>`,addrLine(addr,est),hours&&'🕒 '+esc(hoursKo(hours)),
       fuels&&'⛽ '+esc(fuels),auto&&'<span class="mp-sub">무인(셀프) 주유기</span>'],lat,lon)},
  wc:{icon:'🚻',label:'화장실',color:'#1C7ED6',data:WC,small:true,
    popup:([lat,lon,name,fee,charge,hours,wheel,op,baby])=>poiPopup('#1C7ED6','화장실',name||'공용 화장실',
      [op&&`<span class="mp-sub">${esc(op)}</span>`,
       '💰 '+(fee===1?'유료'+(charge?' · '+esc(charge):''):fee===0?'무료':'<span class="mp-sub">요금 정보 없음</span>'),
       hours?'🕒 '+esc(hoursKo(hours)):'<span class="mp-sub">🕒 운영시간 정보 없음</span>',
       wheel&&WHEEL[wheel]&&'♿ 휠체어 '+WHEEL[wheel],baby&&'🚼 기저귀 교환대'],lat,lon)},
  hot:{icon:'♨️',label:'온천',color:'#E0A100',data:HS,colorOf:r=>HSK[r[2]][1],small:r=>r[2]==='a',
    popup:([lat,lon,kind,name,region,price,status,from,guide,note,access])=>poiPopup(HSK[kind][1],HSK[kind][0],name,
      [`<span class="mp-sub">${esc(region)}</span>`,price&&'💰 '+esc(price),status&&'🕒 '+esc(status),
       from&&`🎟️ 입장권·투어 ISK ${from.toLocaleString('en-US')}부터`,
       note&&`<span class="mp-sub">${esc(note)}</span>`,access&&`<span class="mp-sub">🚗 ${esc(access)}</span>`,
       guide&&`<a href="https://icelandtravelguide.is${esc(guide)}" target="_blank" rel="noopener">가이드 읽기 ↗</a>`],lat,lon)},
};
const poiCtl=L.Control.extend({options:{position:'topleft'},onAdd(){
  const c=L.DomUtil.create('div','leaflet-bar poi-btns');L.DomEvent.disableClickPropagation(c);
  Object.entries(POI).forEach(([k,p])=>{
    p.main=L.layerGroup();p.minorLayer=L.layerGroup();
    p.data.forEach(r=>{const mi=p.minor&&p.minor(r);
      L.marker([r[0],r[1]],{icon:L.divIcon({className:'pinwrap',iconSize:[0,0],
        html:`<div class="poi${mi||(typeof p.small==='function'?p.small(r):p.small)?' sm':''}" style="--pc:${mi?'#868E96':p.colorOf?p.colorOf(r):p.color}">${p.icon}</div>`}),
        title:p.label,zIndexOffset:-500})
        .bindPopup(()=>p.popup(r),{maxWidth:280,autoPanPaddingTopLeft:[56,16]}).addTo(mi?p.minorLayer:p.main)});
    const a=L.DomUtil.create('a','',c);a.href='#';a.textContent=p.icon;a.setAttribute('role','button');p.btn=a;
    L.DomEvent.on(a,'click',e=>{L.DomEvent.preventDefault(e);setPoi(k,!p.on)});
  });
  return c}});
new poiCtl().addTo(map);
function syncPoi(){Object.values(POI).forEach(p=>{
  const want=[[p.main,p.on],[p.minorLayer,p.on&&map.getZoom()>=(p.minorZoom||0)]];
  want.forEach(([lg,on])=>{if(on&&!map.hasLayer(lg))lg.addTo(map);else if(!on&&map.hasLayer(lg))map.removeLayer(lg)})})}
function setPoi(k,on){const p=POI[k];p.on=on;if(!on)map.closePopup();syncPoi();
  p.btn.classList.toggle('on',on);p.btn.style.setProperty('--pc',p.color);p.btn.setAttribute('aria-pressed',String(on));
  p.btn.title=p.btn.ariaLabel=`${p.label} 아이콘 ${on?'숨기기':'보기'}`;
  try{localStorage.setItem('iceland-poi-'+k,on?'1':'0')}catch(e){}}
map.on('zoomend',syncPoi);
Object.keys(POI).forEach(k=>{let on=false;try{on=localStorage.getItem('iceland-poi-'+k)==='1'||(k==='mart'&&localStorage.getItem('iceland-marts-on')==='1')}catch(e){}setPoi(k,on)});

let sel=0,markers=[],lastBounds=null;
const opt={padding:[50,50],maxZoom:12};

function placeLabels(){
  const w=map.getSize().x;
  const a=markers.map(m=>({p:map.latLngToContainerPoint(m.getLatLng()),l:m.getElement()&&m.getElement().querySelector('.lbl')})).filter(o=>o.l);
  a.forEach(o=>o.l.classList.toggle('left',o.p.x>w*0.62));
  a.sort((x,y)=>x.p.x-y.p.x);
  for(let i=1;i<a.length;i++){const p=a[i-1],q=a[i];
    if(Math.abs(p.p.y-q.p.y)<30&&q.p.x-p.p.x<220){p.l.classList.add('left');q.l.classList.remove('left')}}
}
map.on('zoomend moveend',placeLabels);

function show(n,animate){
  sel=n;layer.clearLayers();markers=[];
  const days=n?[DAYS[n-1]]:DAYS;
  days.forEach(d=>{if(!d.line)return;
    L.polyline(d.line,{color:'#fff',weight:n?9:6,opacity:.85,lineCap:'round',lineJoin:'round',interactive:false}).addTo(layer);
    const w=n?5:3.5;
    (d.legs.length?d.legs:[{pts:d.line}]).forEach(g=>{
      const vis=L.polyline(g.pts,{color:d.c,weight:w,opacity:.95,lineCap:'round',lineJoin:'round',interactive:false}).addTo(layer);
      const txt=g.min!=null
        ?`<div class="legtip"><span class="lt-h" style="--c:${d.c}">${n?'':d.n+'일차 · '}${g.a+1} → ${g.b+1}</span><span>${PL[d.stops[g.a]][0]} → ${PL[d.stops[g.b]][0]}</span><b>🚗 차로 ${fmtM(g.min)} · ${g.km}km</b></div>`
        :`${d.n}일차 · ${d.title}`;
      const hit=L.polyline(g.pts,{color:'#000',opacity:0,weight:22,lineCap:'round',lineJoin:'round'})
        .bindTooltip(txt,{sticky:true,direction:'top',offset:[0,-10],opacity:1}).addTo(layer);
      hit.on('mouseover',()=>vis.setStyle({weight:w+3}));
      hit.on('mouseout',()=>vis.setStyle({weight:w}));
      hit.on('click',e=>{if(!sel){show(d.n,true);return}hit.openTooltip(e.latlng);vis.setStyle({weight:w+3})});
    })});
  if(!n)DAYS.forEach(x=>x.stops.forEach(k=>{
    L.marker(ll(k),{icon:icon(`<div class="pin mid${memoOf(x.n,k)?' has-memo':''}" style="--c:${x.c}">${x.n}</div>`),title:`${x.n}일차 · ${PL[k][0]}`})
      .on('click',()=>show(x.n,true)).addTo(layer)}));
  else{const d=DAYS[n-1];d.stops.forEach((k,j)=>{
    const m=L.marker(ll(k),{icon:icon(`<div class="pin big${memoOf(d.n,k)?' has-memo':''}" style="--c:${d.c}">${j+1}<span class="lbl">${PL[k][0]}</span></div>`),zIndexOffset:1000-j});
    let pe=null;
    m.bindPopup(()=>pe||(pe=popupFor(d,k,j,m)),{minWidth:250,maxWidth:280,className:'pp-wrap',autoPanPaddingTopLeft:[56,16],autoPanPaddingBottomRight:[56,20]}).addTo(layer);
    markers.push(m)})}
  const pts=[];days.forEach(d=>{d.stops.forEach(k=>pts.push(ll(k)));if(d.line)pts.push(...d.line)});
  const b=L.latLngBounds(pts);lastBounds=b;map.invalidateSize();
  if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)map.flyToBounds(b,{...opt,duration:.8});
  else map.fitBounds(b,opt);
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.n===n)));
  n?renderDay(DAYS[n-1]):renderAll();
  try{history.replaceState(null,'',n?'#day'+n:'#all')}catch(e){}
  setTimeout(placeLabels,0);
}

const grid=document.getElementById('grid');
function rowsOf(d){
  const legs=ROUTES[d.n]?ROUTES[d.n].legs:[];let seen=[],rows='';
  d.items.forEach(([t,x,k,tags,note])=>{
    let first=-1;
    if(k&&!seen.includes(k)){const li=seen.length;seen.push(k);first=li;
      if(li>0&&legs[li-1])rows+=`<li class="drive"><span></span><span class="x">차로 ${fmt(legs[li-1].min)} · ${legs[li-1].km}km</span></li>`}
    rows+=`<li><span class="t ${t&&t!=='이후'?'has':''}">${t||'·'}</span><span class="x">${k?`<a href="${gm(k)}" target="_blank" rel="noopener">${x}</a>`:x}${(tags||[]).map(g=>`<span class="tag">${g}</span>`).join('')}${note?`<span class="note">${note}</span>`:''}</span></li>`;
    const mm=first>=0&&memoOf(d.n,k);
    if(mm)rows+=`<li class="memo" data-j="${first}" title="지도에서 메모 열기"><span></span><span class="mm">📝 ${esc(mm).replace(/\n/g,'<br>')}</span></li>`;
  });return rows}
function renderAll(){
  grid.className='grid';
  grid.innerHTML=DAYS.map(d=>`<article class="day" tabindex="0" data-n="${d.n}" style="--c:${d.c}"><div class="dh"><span class="dn">${d.n}일차</span><span class="dt">${d.title}</span><span class="dd">${d.date} (${d.wd})</span></div><ol>${rowsOf(d)}</ol></article>`).join('');
  grid.querySelectorAll('.day').forEach(c=>{const go=e=>{if(e.target.closest('a'))return;show(+c.dataset.n,true);
    mapEl.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})};
    c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}}});
}
function renderDay(d){
  grid.className='';
  grid.innerHTML=`<article class="day" style="--c:${d.c}"><div class="dh"><span class="dn">${d.n}일차</span><span class="dt">${d.title}</span><span class="dd">${d.date} (${d.wd})</span>
  <span class="nav"><button id="prev" aria-label="이전 일차">‹</button><button id="next" aria-label="다음 일차" ${d.n===10?'disabled':''}>›</button></span></div><ol>${rowsOf(d)}</ol></article>`;
  bindMemoRows();
  document.getElementById('prev').onclick=()=>show(d.n-1,true);
  document.getElementById('next').onclick=()=>show(d.n+1,true);
}
const chips=document.getElementById('chips');
{const b=document.createElement('button');b.className='chip all';b.dataset.n=0;b.textContent='전체';b.onclick=()=>show(0,true);chips.appendChild(b)}
DAYS.forEach(d=>{const b=document.createElement('button');b.className='chip';b.dataset.n=d.n;
  b.style.setProperty('--c',d.c);b.innerHTML=`<i></i>${d.n}일차`;b.onclick=()=>show(d.n,true);chips.appendChild(b)});
const fromHash=()=>{const m=/^#day(\d+)$/.exec(location.hash);const n=m?+m[1]:0;return n>=1&&n<=10?n:0};
show(fromHash(),false);
addEventListener('hashchange',()=>{const n=fromHash();if(n!==sel)show(n,true)});
let lastW=0;
new ResizeObserver(()=>{const w=mapEl.clientWidth;map.invalidateSize();
  if(w&&Math.abs(w-lastW)>40&&lastBounds)map.fitBounds(lastBounds,opt);lastW=w}).observe(mapEl);
</script>
</body>
