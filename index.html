<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>아이슬란드 일정표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: title → full-width island map with day chips → two-column day timetable */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#16212B; --muted:#5E6E7A; --line:#D5DEE4;
  --sea:#D6E3EA; --land:#FBFCFC; --coast:#9FB3C0; --ice:#E6F0F6; --iceline:#B7CCDA;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#152029; --ink:#E6EDF2; --muted:#93A3AF; --line:#25333E;
  --sea:#0B1B26; --land:#22303B; --coast:#3E5262; --ice:#2E4250; --iceline:#4A6274; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#152029; --ink:#E6EDF2; --muted:#93A3AF; --line:#25333E;
  --sea:#0B1B26; --land:#22303B; --coast:#3E5262; --ice:#2E4250; --iceline:#4A6274; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px/1 var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.chip[aria-pressed="true"] i{background:#fff}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.map{position:relative;width:100%;aspect-ratio:964/700;max-width:100%;border-radius:12px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke}
.ice{fill:var(--ice);stroke:var(--iceline);stroke-width:.8;vector-effect:non-scaling-stroke}
.case{fill:none;stroke:var(--land);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pin.mid{width:20px;height:20px;font:700 11px/16px var(--mono);color:#fff;text-align:center}
.case.thin{stroke-width:6}.route.thin{stroke-width:3}
.chip.all{--c:var(--ink)}.chip.all[aria-pressed="true"]{color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.grid .day{cursor:pointer}.grid .day:hover{box-shadow:0 0 0 1px var(--c)}
.grid .day:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.route{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map.drag{cursor:grabbing}
.pins{position:absolute;inset:0;pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:3}
.zoom button{width:36px;height:36px;border:0;background:var(--surface);color:var(--ink);font:500 20px/1 var(--font);cursor:pointer;padding:0}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--bg)}
.zoom button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.pin{position:absolute;transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--land);box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:opacity .2s}
.pin.big{width:24px;height:24px;font:700 12px/20px var(--mono);color:#fff;text-align:center;z-index:2}
.lbl{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);white-space:nowrap;
  font:500 12.5px/1.3 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  padding:3px 7px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lbl.left{left:auto;right:calc(100% + 6px)}

.day{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:16px 18px;min-width:0;
  display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:6px;margin-left:8px}
.nav button{font:500 15px/1 var(--font);width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
li.drive{grid-template-columns:56px 1fr;padding:4px 0;border-top:0}
li.drive .x{font-size:12.5px;color:var(--muted);gap:6px}
li.drive .x::before{content:"";width:2px;height:16px;background:var(--c);border-radius:1px;align-self:center}
li.drive + li{border-top:0}
.dh{display:flex;align-items:center;gap:10px}
.dn{background:var(--c);color:#fff;font:700 13px/1 var(--mono);padding:6px 8px;border-radius:6px}
.dt{font-weight:700;font-size:16px}
.dd{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
li:first-child{border-top:0}
.t{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.t.has{color:var(--ink)}
.x{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.x a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.x a:hover{border-bottom-color:var(--ink)}
.tag{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.note{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

  if(matchMedia('(prefers-reduced-motion: reduce)').matches){zoomAt(f,.5,.5);return}
  const t0=performance.now(),D=220;let done=1;
  const step=t=>{const k=Math.min(1,(t-t0)/D),cur=Math.pow(f,k);zoomAt(cur/done,.5,.5);done=cur;if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step)}
const zb=e=>e.stopPropagation();
['zin','zout'].forEach(id=>{const b=document.getElementById(id);b.addEventListener('pointerdown',zb);
  b.onclick=()=>zoomAnim(id==='zin'?1/1.6:1.6)});
mapEl.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const r=mapEl.getBoundingClientRect();
  const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(Math.exp(dy*0.0018),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
const pts=new Map();let last=null;
function gesture(){const r=mapEl.getBoundingClientRect(),a=[...pts.values()];
  const cx=a.reduce((s,p)=>s+p.x,0)/a.length-r.left,cy=a.reduce((s,p)=>s+p.y,0)/a.length-r.top;
  const dist=a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;return{cx,cy,dist,r}}
mapEl.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;cancelAnimationFrame(anim);
  mapEl.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last=gesture();mapEl.classList.add('drag')});
mapEl.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const g=gesture();
  if(last&&last.dist&&g.dist){const f=last.dist/g.dist;zoomAt(f,last.cx/g.r.width,last.cy/g.r.height)}
  vb=clampVb([vb[0]-(g.cx-last.cx)/g.r.width*vb[2],vb[1]-(g.cy-last.cy)/g.r.height*vb[3],vb[2]]);place();last=g});
const up=e=>{pts.delete(e.pointerId);last=pts.size?gesture():null;if(!pts.size)mapEl.classList.remove('drag')};
mapEl.addEventListener('pointerup',up);mapEl.addEventListener('pointercancel',up);
</script>
